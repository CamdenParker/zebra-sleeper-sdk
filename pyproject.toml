[project]
name = "sleeper-sdk"
version = "0.1.0"
description = "Two async helpers for Sleeper login and verified lineup swaps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "playwright>=1.51",
]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
